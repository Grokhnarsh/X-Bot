# =============================================================================
#  Textbausteine fuer den X-Bot
#
#  Diese Datei ist der Rueckfallweg, wenn keine KI konfiguriert ist
#  (content.provider: template, oder kein ANTHROPIC_API_KEY gesetzt).
#
#  Platzhalter in geschweiften Klammern werden aus "variables" zufaellig
#  gefuellt. Unbekannte Platzhalter fuehren zu einer klaren Fehlermeldung,
#  nicht zu einem kaputten Beitrag.
#
#  Passe die Texte an deine Stimme an - je konkreter, desto besser.
# =============================================================================

variables:
  werkzeug:
    - "ruff"
    - "pytest"
    - "mypy"
    - "pre-commit"
    - "Docker"
    - "GitHub Actions"

  zeitraum:
    - "eine Woche"
    - "einen Nachmittag"
    - "zwei Sprints"
    - "einen Monat"

  aufwand:
    - "zehn Minuten"
    - "eine halbe Stunde"
    - "einen Vormittag"

  praxis:
    - "kleine Pull Requests"
    - "aussagekraeftige Fehlermeldungen"
    - "Tests fuer den Fehlerfall"
    - "Logs mit Kontext"
    - "ein ehrliches README"

  metrik:
    - "Fehlerrate"
    - "Build-Dauer"
    - "Zeit bis zur ersten Diagnose"
    - "Zahl der manuellen Schritte"

# -----------------------------------------------------------------------------
# Eigene Beitraege
# -----------------------------------------------------------------------------
posts:
  - "{werkzeug} einzurichten kostet {aufwand}. Es nicht zu tun kostet jede Woche mehr."
  - "Die unterschaetzteste Optimierung: {praxis}. Kostet nichts, wirkt sofort."
  - "Bevor du etwas optimierst, miss die {metrik}. Ohne Zahl ist jede Verbesserung ein Gefuehl."
  - "Automatisierung lohnt sich nicht ab einer bestimmten Haeufigkeit, sondern ab einer bestimmten Fehleranfaelligkeit."
  - "Wer {praxis} ernst nimmt, braucht seltener lange Meetings ueber Code."
  - "Ein Skript, das nur du ausfuehren kannst, ist keine Automatisierung. Es ist eine Abhaengigkeit."
  - "Nach {zeitraum} mit {werkzeug}: der groesste Gewinn war nicht die Geschwindigkeit, sondern dass Diskussionen ueber Stil aufgehoert haben."
  - "Technische Schulden sind erst dann ein Problem, wenn niemand mehr sagen kann, wie hoch sie sind."
  - "Guter Code erklaert das Was. Gute Commits erklaeren das Warum. Beides zusammen spart dem naechsten Menschen {aufwand}."
  - "Die meisten Produktionsfehler sind keine Ueberraschung. Sie sind ein Randfall, den jemand bewusst verschoben hat."
  - "Wenn ein Prozess dreimal manuell lief, ist er ein Kandidat fuer ein Skript. Wenn er dreimal schiefging, ist er ein Auftrag."
  - "Observability vor Optimierung: erst sehen, wo die Zeit hingeht, dann etwas daran aendern."
  - "Ein Test, der nur bestaetigt, dass der Code macht was er macht, testet nichts. Teste die Annahme, nicht die Implementierung."
  - "{praxis} wirkt langweilig, bis der erste Vorfall um drei Uhr nachts kommt."
  - "Modelle in Produktion scheitern selten am Modell. Sie scheitern an Daten, die sich leise veraendert haben."
  - "Ein LLM ersetzt kein Verstaendnis des Problems. Es beschleunigt nur den Weg dorthin - oder den Weg in die falsche Richtung."
  - "Die ehrlichste Kennzahl eines Projekts: wie lange braucht ein neuer Mensch bis zum ersten gruenen Testlauf?"
  - "Wiederholbarkeit schlaegt Geschwindigkeit. Ein Deployment, das immer gleich laeuft, ist mehr wert als eines, das manchmal schneller ist."
  - "Loesche toten Code. Er kostet keine Laufzeit, aber jede Menge Aufmerksamkeit."
  - "Konfiguration gehoert in Dateien, Geheimnisse in die Umgebung und beides nicht in den Commit."

# -----------------------------------------------------------------------------
# Antworten auf fremde Beitraege
#
# Diese Texte sind bewusst allgemein gehalten. Antworten ohne KI koennen den
# fremden Beitrag nicht wirklich lesen - setze "reply" deshalb nur dann als
# Aktion ein, wenn die KI aktiv ist, oder halte die Liste sehr neutral.
# -----------------------------------------------------------------------------
replies:
  - "Guter Punkt. Ergaenzend hilft hier oft {praxis}."
  - "Sehe ich aehnlich - in der Praxis war bei uns {praxis} der groesste Hebel."
  - "Spannend. Hast du dabei auch die {metrik} im Blick behalten?"
  - "Dazu passt: {werkzeug} nimmt einem genau diesen Schritt ab."
  - "Interessanter Ansatz. Wie verhaelt sich das ueber {zeitraum} hinweg?"
