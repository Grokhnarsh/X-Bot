[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-bot"
version = "1.0.0"
description = "Automatisiert Beitraege, Likes, Reposts und Hashtag-Reaktionen auf X"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tweepy>=4.16,<5",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "anthropic>=1.0,<2",
]

[project.optional-dependencies]
web = ["Flask>=3.0,<4", "ruamel.yaml>=0.18,<0.19", "waitress>=3.0,<4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "Flask>=3.0,<4", "ruamel.yaml>=0.18,<0.19"]

[project.scripts]
xbot = "xbot.cli:main"

[tool.setuptools.packages.find]
include = ["xbot*"]

[tool.setuptools.package-data]
"xbot.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
