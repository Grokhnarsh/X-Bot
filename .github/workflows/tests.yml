name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-web.txt

      - name: Tests
        run: python -m pytest -q --cov=xbot --cov-report=term-missing

      - name: Beispielkonfiguration pruefen
        run: |
          cp config.example.yaml config.yaml
          python -m xbot -q doctor || true
          python -m xbot -q preview -n 2

      - name: Weboberflaeche startet
        env:
          XBOT_WEB_PASSWORD: ci-testpasswort
        run: |
          python - <<'EOF'
          from xbot.web import create_app
          app = create_app("config.yaml", setup_logging=False)
          client = app.test_client()
          assert client.get("/login").status_code == 200
          assert client.get("/").status_code == 302
          app.extensions["xbot_runner"].shutdown()
          print("Weboberflaeche laeuft an.")
          EOF
